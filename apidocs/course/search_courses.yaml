查询课程（需要加参数，如 ?Course_Id=xxx，?Query=xxx）
---
tags:
  - 课程模块

parameters:
  - name: Course_Id
    in: query
    description: 传递课程id
    type: string
    required: false
  - name: Query
    in: query
    description: 传递课程名称
    type: string
    required: false

responses:
  200:
    description: 获取章节详情成功
    schema:
      type: object
      properties:
        code:
          type: integer
          description: 状态码
        message:
          type: string
          description: 提示信息
        Course_Id:
          type: string
          description: 课程ID
        Course_Title:
          type: string
          description: 课程标题
        Introduction:
          type: string
          description: 课程简介
        Chapters:
          type: integer
          description: 课程章节数
        Course_Tags:
          type: string
          description: 课程标签
        Course_Class_Hour:
          type: integer
          description: 课时数
        Course_Difficulty:
          type: integer
          description: 课程难度（1-5级）
        Course_Other_Tags:
          type: array
          items:
            type: string
          description: 其他标签列表
        Course_List:
          type: array
          description: 课程列表（仅当使用Query参数时返回）
          items:
            type: object
            properties:
              Course_Id:
                type: string
                description: 课程ID
              Course_Title:
                type: string
                description: 课程标题
              Introduction:
                type: string
                description: 课程简介
              Chapters:
                type: integer
                description: 课程章节数
              Course_Tags:
                type: string
                description: 课程标签
              Course_Class_Hour:
                type: integer
                description: 课时数
              Course_Difficulty:
                type: integer
                description: 课程难度（1-5级）
              Course_Other_Tags:
                type: array
                items:
                  type: string
                description: 其他标签列表
  400:
    description: 传参格式有误
  401:
    description: 课程不存在