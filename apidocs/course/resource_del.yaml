admin删除课程资源（对象存储与元数据一并删除）
---
tags:
  - 课程模块

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: admin token

  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        Resource_Id:
          type: integer
          description: 资源id

responses:
  200:
    description: 删除成功
  400:
    description: 用户权限不够
  402:
    description: 参数错误
  404:
    description: 资源不存在
