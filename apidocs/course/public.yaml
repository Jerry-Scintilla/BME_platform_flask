创建课程简介（需要管理员权限，html格式）
---
tags:
  - 课程模块
consumes:
  - multipart/form-data
parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token
  - name: Course_title
    in: formData
    type: string
    required: true
    description: 课程名
  - name: Course_Introduction
    in: formData
    type: string
    required: true
    description: 课程简介
  - name: Course_Chapters
    in: formData
    type: string
    required: true
    description: 课程章节数
  - name: Course_Class_Hour
    in: formData
    type: integer
    required: false
    description: 课时数
  - name: Course_Difficulty
    in: formData
    type: integer
    required: false
    description: 课程难度（1-5级）
  - name: Course_Other_Tags
    in: formData
    type: string
    required: false
    description: 其他标签（多个标签以英文逗号分隔）
  - name: Cover
    in: formData
    type: file
    required: False
    description: 上传课程封面
responses:
  400:
    description: 用户权限不够
  200:
    description: 上传完成
  401:
    description: 课程参数有误