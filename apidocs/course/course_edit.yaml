修改课程信息(需要token)
---
tags:
  - 课程模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: course_edit
      required:
        - name
      properties:
        Course_Id:
          type: string
          description: 课程id
          default: "11111111"
        Course_title:
          type: string
          description: 课程标题
#          default: "男"
        Course_Introduction:
          type: string
          description: 课程简介
#          default: "134567895"
        Course_Tags:
          type: string
          description: 课程标签
#          default: "生物医学工程学院"
        Course_Class_Hour:
          type: integer
          description: 课时数
          minimum: 1
          maximum: 1000
        Course_Difficulty:
          type: integer
          description: 课程难度（1-5级）
          minimum: 1
          maximum: 5
        Course_Other_Tags:
          type: string
          description: 其他标签（多个标签以英文逗号分隔）


responses:
  200:
    description: 课程信息修改完成
  400:
    description: 用户权限不够
  401:
    description: 表单错误
