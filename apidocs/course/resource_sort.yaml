admin调整课程资源顺序（Resource_Ids按目标顺序传数组）
---
tags:
  - 课程模块

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: admin token

  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        Course_Id:
          type: integer
          description: 课程id
        Resource_Ids:
          type: array
          items:
            type: integer
          description: 按目标顺序排列的资源id

responses:
  200:
    description: 排序成功
  400:
    description: 用户权限不够
  402:
    description: 参数错误
