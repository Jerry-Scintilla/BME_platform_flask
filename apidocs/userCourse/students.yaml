获取课程学生列表
---
tags:
  - 用户选课模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: Course_Id
    in: query
    type: integer
    required: true
    description: 课程ID

responses:
  200:
    description: 获取成功
  400:
    description: 课程ID为空
  403:
    description: 权限不足
  404:
    description: 用户或课程不存在
