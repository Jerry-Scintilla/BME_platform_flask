检查用户是否已选课程
---
tags:
  - 用户选课模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: Course_Id
    in: query
    type: integer
    required: true
    description: 课程ID

responses:
  200:
    description: 查询成功（data 含 camp_session_id，09-14 营期口径；2026-09-20 B2 起改为课程分配表口径：学员该课当前有效分配营（非 archived）才返回，同课跨营多活营取最新分配营——供前端做营期快照进度口径分流；无有效分配或已结营为 null）
  400:
    description: 课程ID为空
  404:
    description: 用户不存在
