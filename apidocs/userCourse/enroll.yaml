用户选课
---
tags:
  - 用户选课模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: user_course_enroll
      required:
        - Course_Id
      properties:
        Course_Id:
          type: integer
          description: 课程ID

responses:
  200:
    description: 选课成功
  400:
    description: 参数错误或已选课
  404:
    description: 用户或课程不存在
