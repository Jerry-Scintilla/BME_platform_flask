批准请假信息
---
tags:
  - 信息管理
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: leave_approve
      required:
        - id
      properties:
        id:
          type: integer
          description: 请假信息ID

responses:
  200:
    description: 请假申请已批准
  400:
    description: 请求参数错误
  401:
    description: 未授权
  403:
    description: 权限不足，仅组长或管理员可批准请假
  404:
    description: 用户或请假信息不存在 