添加报错信息
---
tags:
  - 信息管理

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token
    
  - name: title
    in: formData
    type: string
    required: true
    description: 报错标题
    
  - name: content
    in: formData
    type: string
    required: false
    description: 报错内容
    
  - name: image
    in: formData
    type: file
    required: false
    description: 报错相关的图片（可选）
    
responses:
  200:
    description: 报错信息提交成功
  400:
    description: 报错标题不能为空
  404:
    description: 用户不存在 