批量删除提醒信息(需要token)
---
tags:
  - 信息提醒模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: 用户token

  - name: body
    in: body
    required: true
    schema:
      id: reminder_batch_delete
      properties:
        user_id:
          type: integer
          description: 指定接收者ID（管理员使用）
          example: 456
        info_id:
          type: integer
          description: 关联的原始信息ID
          example: 789
        ids:
          type: array
          description: 指定要删除的提醒ID列表
          items:
            type: integer
          example: [123, 456, 789]
        type:
          type: integer
          description: 提醒源的类型(1:请假 2:任务 3:通知 4:报错 5:作业)
          example: 2

responses:
  200:
    description: 批量删除提醒成功
    schema:
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "批量删除提醒成功"
        data:
          type: object
          properties:
            deleted_count:
              type: integer
              description: 已删除的提醒数量
              example: 3
  403:
    description: 权限不足，只有管理员可以删除其他用户的提醒
  404:
    description: 用户不存在 