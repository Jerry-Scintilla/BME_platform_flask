description: |
  ## 提醒信息数据模型
  
  提醒信息使用InformationModel表存储，type=0表示提醒信息。
  
  ### 关键字段说明
  
  - `id`: 提醒信息的唯一标识
  - `type`: 固定为0，表示提醒信息
  - `title`: 提醒标题
  - `content`: 提醒内容
  - `range`: 关联原始信息的ID
  - `student_id`: 接收提醒的用户ID
  - `group_id`: 所属小组ID
  - `priority`: 存储原始信息类型 (1:请假 2:任务 3:通知 4:报错 5:作业)
  - `create_time`: 创建时间
  
  ### 提醒信息分类
  
  提醒信息根据`priority`字段（存储原始信息类型）分类：
  
  - `1`: 请假相关提醒
  - `2`: 任务相关提醒
  - `3`: 通知相关提醒
  - `4`: 报错相关提醒
  - `5`: 作业相关提醒
  - `0`或其他: 其他类型提醒
  
  ### 提醒信息流程
  
  1. 创建提醒：当用户执行特定操作（如提交请假、发布任务等）时自动创建
  2. 查询提醒：用户可查询自己收到的所有提醒，按类型分类
  3. 删除提醒：用户查看提醒后可删除单个提醒或批量删除提醒
  4. 级联删除：删除原始信息时，相关联的提醒也会被删除 