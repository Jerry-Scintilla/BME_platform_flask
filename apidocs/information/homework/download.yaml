tags:
  - 作业信息模块
summary: 下载作业文件
description: 下载作业文件（打包为zip格式）
produces:
  - application/zip
parameters:
  - name: Authorization
    in: header
    description: 用户登录token
    required: true
    type: string
  - name: id
    in: query
    description: 作业ID
    required: true
    type: integer
responses:
  200:
    description: 成功返回作业文件（zip格式）
  400:
    description: 请求参数错误
    schema:
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: 作业ID不能为空
  403:
    description: 权限不足
    schema:
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          example: 无权下载此作业
  404:
    description: 资源不存在
    schema:
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: 作业文件不存在 