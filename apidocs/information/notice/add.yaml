添加或修改通知信息
---
tags:
  - 信息管理
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: notice_add
      required:
        - Group_Id
        - Title
      properties:
        Id:
          type: integer
          description: 通知ID（提供此字段时为修改操作，不提供时为添加操作）
        Group_Id:
          type: integer
          description: 小组ID
        Title:
          type: string
          description: 通知标题
        Content:
          type: string
          description: 通知内容
        Range:
          type: string
          description: 通知范围，"0"表示全组通知，否则为接收者ID列表，用逗号分隔，默认为"0"

responses:
  200:
    description: 通知创建或修改成功
  400:
    description: 请求参数错误或小组不存在
  401:
    description: 未授权
  403:
    description: 权限不足，只有组长或管理员可以创建/修改通知
  404:
    description: 用户不存在或通知不存在（修改操作时） 