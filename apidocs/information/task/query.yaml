查询任务信息
---
tags:
  - 信息管理

consumes:
  - application/json
  
parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token
  - name: group_id
    in: query
    type: integer
    required: false
    description: 小组ID（仅管理员可使用此参数查询）
  - name: priority
    in: query
    type: integer
    required: false
    description: 优先级（1-5之间，筛选特定优先级的任务）

responses:
  200:
    description: 查询成功
    schema:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            high_priority:
              type: array
              description: 高优先级任务（1-2级）
              items:
                type: object
            medium_priority:
              type: array
              description: 中优先级任务（3级）
              items:
                type: object
            low_priority:
              type: array
              description: 低优先级任务（4-5级）
              items:
                type: object
  401:
    description: 未授权
  403:
    description: 权限不足（使用group_id参数时）
  404:
    description: 用户不存在 