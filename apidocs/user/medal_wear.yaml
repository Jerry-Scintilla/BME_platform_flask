佩戴奖牌
---
tags:
  - 用户模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: medal_wear
      required:
        - Medal_Id
      properties:
        Medal_Id:
          type: integer
          description: 要佩戴的奖牌 id

responses:
  200:
    description: 佩戴奖牌成功
  400:
    description: 请求参数错误（例如缺少 Medal_Id）
  401:
    description: 用户不存在或鉴权失败
  404:
    description: 该用户未拥有该奖牌
  500:
    description: 服务器内部错误
