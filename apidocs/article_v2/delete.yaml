删除文章（V2）
---
tags:
  - 文章模块V2
consumes:
  - application/json
parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: Bearer token
  - name: article_id
    in: path
    type: integer
    required: true
    description: 文章 id

responses:
  200:
    description: 文章删除成功
  403:
    description: 用户权限不足
  404:
    description: 找不到该文章
