tags:
  - 权限管理
summary: 撤销用户权限
description: 撤销指定用户的特定权限，只有具有系统管理权限的用户可以调用
parameters:
  - name: Authorization
    in: header
    description: JWT token
    required: true
    type: string
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
          description: 用户ID
        permission_id:
          type: integer
          example: 1
          description: 权限ID（与permission_name二选一）
        permission_name:
          type: string
          example: "course_management"
          description: 权限名称（与permission_id二选一）
responses:
  '200':
    description: 成功撤销权限
    schema:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "成功撤销用户权限 course_management"
  '400':
    description: 请求参数错误或用户没有该权限
    schema:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "用户没有该权限"
  '403':
    description: 权限不足
    schema:
      type: object
      properties:
        code:
          type: integer
          example: 403
        message:
          type: string
          example: "用户权限不足"
  '404':
    description: 用户或权限不存在
    schema:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: "用户不存在"