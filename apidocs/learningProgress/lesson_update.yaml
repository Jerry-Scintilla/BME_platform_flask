更新单个课时学习进度
---
tags:
  - 学习进度模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: body
    in: body
    required: true
    schema:
      id: lesson_progress_update
      required:
        - Course_Id
        - Lesson_Id
        - Status
      properties:
        Course_Id:
          type: integer
          description: 课程ID
        Lesson_Id:
          type: integer
          description: 课时ID
        Status:
          type: string
          description: 学习状态 (not_started/learning/completed)
        Duration:
          type: integer
          description: 学习时长（分钟）
        Detail:
          type: object
          description: 详情JSON对象，不同类型课时有不同字段

responses:
  200:
    description: 更新成功（09-14 起按 user_course 营期戳自动分流：戳指向非 archived 营 → 写营期快照表，响应含 scope="camp"+camp_session_id；否则写全局表，scope="global"。请求体无需传营期字段）
  400:
    description: 参数错误或状态无效
  404:
    description: 课程或课时不存在
