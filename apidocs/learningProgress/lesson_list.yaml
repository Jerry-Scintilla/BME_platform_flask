获取课程下所有课时学习进度
---
tags:
  - 学习进度模块
consumes:
  - application/json

parameters:
  - name: Authorization
    in: header
    type: string
    required: true
    description: token

  - name: Course_Id
    in: query
    type: integer
    required: true
    description: 课程ID

  - name: camp_session_id
    in: query
    type: integer
    required: false
    description: 营期ID（09-14）——传入则查该营学习进度快照（营期口径从零），不传查全局进度

responses:
  200:
    description: 查询成功
  400:
    description: 缺少课程ID
  404:
    description: 课程不存在
